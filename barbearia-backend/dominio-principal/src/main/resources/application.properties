spring.application.name=Barbearia Backend

# ========================================
# Datasource MySQL
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/barbearia?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.generate-ddl=false

# ========================================
# Flyway
# ========================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0

# ========================================
# H2 Console (para desenvolvimento)
# (can be removed if you no longer use H2)
# ========================================
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ========================================
# Logging
# ========================================
logging.level.com.cesarschool.barbearia=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.flywaydb=INFO

# ========================================
# Configuração de E-mail (Gmail)
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# COLOQUE SEUS DADOS REAIS ABAIXO:
spring.mail.username=trabalhorequisitosbarbershop@gmail.com

# 🚨🚨🚨🚨🚨🚨 MODIFICAÇÃO ABAIXO 🚨🚨🚨🚨🚨🚨
spring.mail.password=nyyhnaotroiwltfa
# 🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ========================================
# Spring Boot
# ========================================
spring.main.banner-mode=off


