spring.application.name=Barbearia Backend

# ========================================
# Datasource MySQL
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/barbearia_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.generate-ddl=false

# ========================================
# Flyway
# ========================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0

# ========================================
# H2 Console (para desenvolvimento)
# (can be removed if you no longer use H2)
# ========================================
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ========================================
# Logging
# ========================================
logging.level.com.cesarschool.barbearia=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.flywaydb=INFO

# ========================================
# Spring Boot
# ========================================
spring.main.banner-mode=off


